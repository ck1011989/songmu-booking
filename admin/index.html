<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鬆沐｜客人資料後臺</title>
<style>body{font:17px system-ui;background:#fbf9f6;color:#43352d;margin:24px auto;max-width:1100px;padding:16px}input,button,select{font:inherit;padding:10px;margin:5px;border:1px solid #bda995;border-radius:6px}button{cursor:pointer;background:#705943;color:white}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:10px;text-align:left;white-space:pre-wrap}.scroll{overflow:auto}[hidden]{display:none!important}#status{white-space:pre-wrap}label{display:block}input{max-width:90%}</style>
<h1>鬆沐｜客人資料後臺</h1><p id="status" role="status"></p>
<section id="login"><p>管理員：guts1989921@gmail.com</p><label>密碼<input id="password" type="password" autocomplete="current-password" minlength="12"></label><button id="signin">登入</button><button id="signup">首次建立後臺登入</button><p>首次請設定至少 12 碼密碼，完成信箱驗證後回到此頁登入。請勿在對話中提供密碼。</p></section>
<section id="dashboard" hidden><button id="logout">登出</button><button id="reload">重新整理</button><button id="export">下載 Excel</button><label>搜尋姓名、手機、症狀<input id="search" placeholder="輸入關鍵字"></label><p id="count"></p><div class="scroll"><table><thead><tr><th>姓名</th><th>手機</th><th>日期時間</th><th>服务</th><th>症狀</th><th>備註</th><th>狀態</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<script src="./config.js"></script><script src="./xlsx.js"></script><script>
let token=null,records=[];const $=id=>document.getElementById(id);const msg=s=>$('status').textContent=s;
async function api(path,options={}){const r=await fetch(SB+path,{...options,headers:{apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json',...(options.headers||{})}});const raw=await r.text();let v;try{v=raw?JSON.parse(raw):null}catch{v=null}if(!r.ok)throw Error(v?.msg||v?.message||v?.error_description||'操作失敗，請重新登入');return v}
function show(){const q=$('search').value.trim().toLowerCase();const selected=records.filter(r=>[r.submitted_name,r.submitted_phone,r.symptoms,r.notes].join(' ').toLowerCase().includes(q));$('rows').replaceChildren();for(const r of selected){const tr=document.createElement('tr');for(const text of [r.submitted_name||r.customers?.name,r.submitted_phone||r.customers?.phone,new Date(r.starts_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}),r.service_name,r.symptoms,r.notes]){const td=document.createElement('td');td.textContent=text;tr.append(td)}const td=document.createElement('td'),select=document.createElement('select');for(const [v,label] of [['pending','待確認'],['confirmed','已確認'],['completed','已完成'],['cancelled','已取消']]){const o=new Option(label,v,v===r.status,v===r.status);select.add(o)}select.onchange=async()=>{select.disabled=true;try{await api('/rest/v1/appointments?id=eq.'+r.id,{method:'PATCH',body:JSON.stringify({status:select.value})});r.status=select.value;msg('狀態已更新')}catch(e){select.value=r.status;msg(e.message)}select.disabled=false};td.append(select);tr.append(td);$('rows').append(tr)}$('count').textContent='顯示 '+selected.length+' 筆申請';}
async function refresh(){try{records=[];for(let offset=0;;offset+=500){const rows=await api('/rest/v1/appointments?select=*,customers(name,phone,line_id)&order=starts_at.desc&limit=500&offset='+offset);records.push(...rows);if(rows.length<500)break}show();msg('資料已更新')}catch(e){msg(e.message)}}
$('signin').onclick=async()=>{try{const v=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:'guts1989921@gmail.com',password:$('password').value})});token=v.access_token;if(!v.user.email_confirmed_at||v.user.email?.toLowerCase()!=='guts1989921@gmail.com')throw Error('請先完成信箱驗證');$('password').value='';$('login').hidden=true;$('dashboard').hidden=false;await refresh()}catch(e){token=null;msg(e.message)}};
$('signup').onclick=async()=>{if($('password').value.length<12){msg('請設定至少 12 碼密碼');return}try{await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:'guts1989921@gmail.com',password:$('password').value})});$('password').value='';msg('請查看 guts1989921@gmail.com 的驗證信，按信中連結驗證後回到此頁登入。若驗證後跳到無法開啟的頁面，仍可回來嘗試登入。')}catch(e){msg(e.message)}};
$('logout').onclick=async()=>{try{await api('/auth/v1/logout',{method:'POST'})}catch{}token=null;records=[];$('rows').replaceChildren();$('dashboard').hidden=true;$('login').hidden=false;msg('已登出')};
$('reload').onclick=refresh;$('search').oninput=show;
$('export').onclick=()=>{const rows=[['姓名','手機','LINE ID','症狀','備註','服務','日期時間（臺灣）','費用','狀態','申請編號'],...records.map(r=>[r.submitted_name||r.customers?.name,r.submitted_phone||r.customers?.phone,r.customers?.line_id,r.symptoms,r.notes,r.service_name,new Date(r.starts_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}),r.price_ntd,({pending:'待確認',confirmed:'已確認',completed:'已完成',cancelled:'已取消'})[r.status],r.id])];downloadXlsx(rows,'鬆沐客人資料-'+new Date().toISOString().slice(0,10)+'.xlsx');msg('已產生 Excel，請在瀏覽器下載清單查看。檔案包含客人個人資料，請妥善保存。')};
</script></html>
