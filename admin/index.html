<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#705943"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="鬆沐管理"><link rel="manifest" href="/songmu-booking/admin/manifest.webmanifest?v=20261006-2"><link rel="apple-touch-icon" href="/songmu-booking/admin/icon-192-v2.png"><link rel="icon" href="./icon.svg"><title>鬆沐｜預約管理</title></head>
<style>body{font:16px system-ui;background:#fbf9f6;color:#43352d;margin:20px auto;max-width:1200px;padding:14px}input,button,select,textarea{font:inherit;padding:9px;margin:4px;border:1px solid #bda995;border-radius:8px}button{cursor:pointer;background:#705943;color:#fff}.linkbtn{background:transparent;color:#705943;border:0;text-decoration:underline}.danger{background:#8a4f45}.warn{background:#9a7044}.card{background:#fff;border:1px solid #e5dcd3;border-radius:14px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.muted{color:#7b6a5e;font-size:14px}[hidden]{display:none!important}#status{white-space:pre-wrap}textarea{width:calc(100% - 28px);min-height:70px}.actions{display:flex;flex-wrap:wrap;gap:6px}</style>
<h1>🌿 鬆沐｜預約管理</h1><button id="installApp" hidden>安裝鬆沐管理</button><p id="installStatus" class="muted" role="status"></p><p id="status" role="status"></p>
<section id="login" class="card"><p>管理員：guts1989921@gmail.com</p><label>密碼 <input id="password" type="password" autocomplete="current-password" minlength="12"></label><div><button id="signin">登入</button><button id="signup">首次建立後臺登入</button><button id="forgot" class="linkbtn">忘記密碼？</button></div><p class="muted">忘記密碼時會寄重設信到管理員信箱。請勿把密碼傳給任何人。</p></section>
<section id="reset" class="card" hidden><h2>設定新密碼</h2><label>新密碼 <input id="newPassword" type="password" autocomplete="new-password" minlength="12" placeholder="至少 12 碼"></label><label>再次輸入 <input id="newPassword2" type="password" autocomplete="new-password" minlength="12"></label><div><button id="savePassword">儲存新密碼</button><button id="cancelReset" class="linkbtn">取消</button></div></section>
<section id="dashboard" hidden><div class="actions"><button id="logout">登出</button><button id="reload">重新整理</button><button id="export">下載 Excel</button></div><label>搜尋姓名、手機、症狀、備註 <input id="search" placeholder="輸入關鍵字"></label><p id="count"></p><div id="cards"></div></section>
<script src="/songmu-booking/admin/config.js"></script><script src="/songmu-booking/admin/xlsx.js"></script><script>
const ADMIN_PATH='/songmu-booking/admin/',ADMIN_URL='https://ck1011989.github.io'+ADMIN_PATH;
if(location.pathname!==ADMIN_PATH)location.replace(ADMIN_URL+location.search+location.hash);
let token=null,records=[];const $=id=>document.getElementById(id),msg=s=>$('status').textContent=s;
function friendlyError(text=''){const s=String(text).toLowerCase();if(s.includes('email rate limit exceeded')||s.includes('rate limit'))return '密碼重設信寄送次數過於頻繁，請稍後再試，請勿重複點擊「忘記密碼」。';if(s.includes('invalid login credentials'))return '密碼不正確，請重新輸入；若忘記密碼請使用「忘記密碼？」。';if(s.includes('email not confirmed'))return '管理員信箱尚未完成驗證，請先查看驗證信。';if(s.includes('password')&&s.includes('characters'))return '密碼格式不符合要求，請設定至少 12 碼的新密碼。';return text||'操作失敗，請稍後再試。'}
async function api(path,options={}){const r=await fetch(SB+path,{...options,headers:{apikey:KEY,...(token?{Authorization:'Bearer '+token}:{}),'Content-Type':'application/json',...(options.headers||{})}});const raw=await r.text();let v;try{v=raw?JSON.parse(raw):null}catch{v=null}if(!r.ok)throw Error(friendlyError(v?.msg||v?.message||v?.error_description||'操作失敗，請重新登入'));return v}
const labels={pending:'待確認',confirmed:'已確認',completed:'已完成',cancelled:'已取消'},outcomes={normal:'正常',cancelled_before_service:'服務前取消',cancelled_during_service:'服務中取消'};
function field(parent,label,value){const d=document.createElement('div'),b=document.createElement('b');b.textContent=label+'：';d.append(b,document.createTextNode(value||'—'));parent.append(d)}
async function saveOutcome(r,type,note){if(type!=='normal'&&!note.trim()){msg('取消紀錄必須填寫備註');return}const status=type==='cancelled_before_service'?'cancelled':type==='cancelled_during_service'?'completed':r.status;await api('/rest/v1/appointments?id=eq.'+r.id,{method:'PATCH',body:JSON.stringify({outcome:type,outcome_note:type==='normal'?null:note.trim(),outcome_at:type==='normal'?null:new Date().toISOString(),status})});msg('已存檔：'+outcomes[type]);await refresh()}
function show(){const q=$('search').value.trim().toLowerCase(),selected=records.filter(r=>[r.submitted_name,r.submitted_phone,r.symptoms,r.notes,r.outcome_note].join(' ').toLowerCase().includes(q));$('cards').replaceChildren();for(const r of selected){const c=document.createElement('article');c.className='card';const h=document.createElement('h3');h.textContent=(r.submitted_name||r.customers?.name||'未填姓名')+'｜'+new Date(r.starts_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'});c.append(h);const g=document.createElement('div');g.className='grid';field(g,'手機',r.submitted_phone||r.customers?.phone);field(g,'服務',r.service_name);field(g,'金額',r.price_ntd?'NT$ '+r.price_ntd:'');field(g,'預約狀態',labels[r.status]||r.status);field(g,'處理結果',outcomes[r.outcome||'normal']);field(g,'處理時間',r.outcome_at?new Date(r.outcome_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'—');c.append(g);field(c,'症狀',r.symptoms);field(c,'客人備註',r.notes);field(c,'取消／服務紀錄備註',r.outcome_note);const status=document.createElement('select');for(const [v,l] of Object.entries(labels))status.add(new Option(l,v,v===r.status,v===r.status));status.onchange=async()=>{if(status.value==='completed'&&!confirm('確認服務已完成？')){status.value=r.status;return}try{await api('/rest/v1/appointments?id=eq.'+r.id,{method:'PATCH',body:JSON.stringify({status:status.value})});msg('預約狀態已更新');await refresh()}catch(e){msg(e.message)}};c.append(document.createTextNode('預約狀態：'),status);const note=document.createElement('textarea');note.placeholder='取消原因／服務中止原因（取消時必填）';note.value=r.outcome_note||'';c.append(note);const a=document.createElement('div');a.className='actions';for(const [text,cls,type,confirmText] of [['正常完成','', 'normal','確認正常完成本次服務？'],['服務前取消','danger','cancelled_before_service','確認客人在服務開始前取消？此時段將重新釋放。'],['服務中取消','warn','cancelled_during_service','確認服務進行到一半中止？將保留為服務紀錄。']]){const b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=async()=>{if(!confirm(confirmText))return;try{if(type==='normal'){await api('/rest/v1/appointments?id=eq.'+r.id,{method:'PATCH',body:JSON.stringify({status:'completed',outcome:'normal',outcome_note:null,outcome_at:null})});msg('已存檔：正常完成');await refresh()}else await saveOutcome(r,type,note.value)}catch(e){msg(e.message)}};a.append(b)}c.append(a);$('cards').append(c)}$('count').textContent='顯示 '+selected.length+' 筆預約'}
async function refresh(){try{records=[];for(let offset=0;;offset+=500){const rows=await api('/rest/v1/appointments?select=*,customers(name,phone,line_id)&order=starts_at.desc&limit=500&offset='+offset);records.push(...rows);if(rows.length<500)break}show();msg('資料已更新')}catch(e){msg(e.message)}}
$('signin').onclick=async()=>{try{const v=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:'guts1989921@gmail.com',password:$('password').value})});token=v.access_token;if(!v.user.email_confirmed_at||v.user.email?.toLowerCase()!=='guts1989921@gmail.com')throw Error('請先完成信箱驗證');$('password').value='';$('login').hidden=true;$('dashboard').hidden=false;await refresh()}catch(e){token=null;msg(friendlyError(e.message))}};
$('signup').onclick=async()=>{if($('password').value.length<12){msg('請設定至少 12 碼密碼');return}try{await api('/auth/v1/signup?redirect_to='+encodeURIComponent(ADMIN_URL),{method:'POST',body:JSON.stringify({email:'guts1989921@gmail.com',password:$('password').value})});$('password').value='';msg('請到管理員信箱完成驗證後回來登入。')}catch(e){msg(friendlyError(e.message))}};
$('forgot').onclick=async()=>{if(!confirm('要寄送密碼重設信到管理員信箱 guts1989921@gmail.com 嗎？'))return;try{await api('/auth/v1/recover?redirect_to='+encodeURIComponent(ADMIN_URL),{method:'POST',body:JSON.stringify({email:'guts1989921@gmail.com'})});msg('密碼重設信已送出。請查看管理員信箱，點擊最新信件中的「重設密碼」。請勿連續重複寄送。')}catch(e){msg(friendlyError(e.message))}};
async function readRecovery(){
const hash=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search);
const error=hash.get('error_description')||query.get('error_description');
if(error){history.replaceState(null,'',ADMIN_PATH);msg('重設連結已失效或過期，請重新寄送密碼重設信並使用最新信件。');return}
const access=hash.get('access_token'),type=hash.get('type');
if(access&&type==='recovery'){
 token=access;history.replaceState(null,'',ADMIN_PATH);
 try{const user=await api('/auth/v1/user');if(!user.email_confirmed_at||user.email?.toLowerCase()!=='guts1989921@gmail.com')throw Error('此連結不是管理員的密碼重設連結');
 $('login').hidden=true;$('dashboard').hidden=true;$('reset').hidden=false;msg('請設定新的管理員密碼。');
 }catch(e){token=null;msg(friendlyError(e.message))}
}}
$('savePassword').onclick=async()=>{const p=$('newPassword').value,p2=$('newPassword2').value;if(p.length<12){msg('新密碼至少需要 12 碼');return}if(p!==p2){msg('兩次輸入的密碼不一致');return}try{await api('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:p})});$('newPassword').value=$('newPassword2').value='';$('reset').hidden=true;$('login').hidden=false;token=null;history.replaceState(null,'',location.pathname);msg('密碼已更新，請使用新密碼登入。')}catch(e){msg(friendlyError(e.message))}};$('cancelReset').onclick=()=>{token=null;$('reset').hidden=true;$('login').hidden=false;history.replaceState(null,'',location.pathname);msg('已取消密碼重設')};
$('logout').onclick=async()=>{try{await api('/auth/v1/logout',{method:'POST'})}catch{}token=null;records=[];$('cards').replaceChildren();$('dashboard').hidden=true;$('login').hidden=false;msg('已登出')};$('reload').onclick=refresh;$('search').oninput=show;
$('export').onclick=()=>{const rows=[['姓名','手機','服務','日期時間（臺灣）','費用','預約狀態','處理結果','處理備註','處理時間','症狀','客人備註','申請編號'],...records.map(r=>[r.submitted_name||r.customers?.name,r.submitted_phone||r.customers?.phone,r.service_name,new Date(r.starts_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}),r.price_ntd,labels[r.status],outcomes[r.outcome||'normal'],r.outcome_note||'',r.outcome_at?new Date(r.outcome_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'',r.symptoms,r.notes,r.id])];downloadXlsx(rows,'鬆沐預約資料-'+new Date().toISOString().slice(0,10)+'.xlsx');msg('已產生 Excel。')};
readRecovery();
let installPrompt=null;
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;$('installApp').hidden=false;$('installStatus').textContent='可將鬆沐管理安裝到電腦。'});
$('installApp').onclick=async()=>{if(!installPrompt)return;const prompt=installPrompt;installPrompt=null;await prompt.prompt();const result=await prompt.userChoice;$('installApp').hidden=true;$('installStatus').textContent=result.outcome==='accepted'?'已安裝鬆沐管理。':'已取消安裝，可使用 Brave 選單中的安裝功能。'};
window.addEventListener('appinstalled',()=>{$('installApp').hidden=true;$('installStatus').textContent='已安裝鬆沐管理。'});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register(ADMIN_PATH+'sw.js',{scope:ADMIN_PATH,updateViaCache:'none'}).then(r=>r.update()).catch(()=>{$('installStatus').textContent='安裝功能暫時無法啟用，請重新整理後再試。'}));
</script></html>
