<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鬆沐｜預約管理</title>
<style>body{font:16px system-ui;background:#fbf9f6;color:#43352d;margin:20px auto;max-width:1200px;padding:14px}input,button,select,textarea{font:inherit;padding:9px;margin:4px;border:1px solid #bda995;border-radius:8px}button{cursor:pointer;background:#705943;color:#fff}.danger{background:#8a4f45}.warn{background:#9a7044}.card{background:#fff;border:1px solid #e5dcd3;border-radius:14px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.muted{color:#7b6a5e;font-size:14px}[hidden]{display:none!important}#status{white-space:pre-wrap}textarea{width:calc(100% - 28px);min-height:70px}.actions{display:flex;flex-wrap:wrap;gap:6px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eee4da}</style>
<h1>🌿 鬆沐｜預約管理</h1><p id="status" role="status"></p>
<section id="login" class="card"><p>管理員：guts1989921@gmail.com</p><label>密碼 <input id="password" type="password" autocomplete="current-password" minlength="12"></label><div><button id="signin">登入</button><button id="signup">首次建立後臺登入</button></div><p class="muted">首次請設定至少 12 碼密碼並完成信箱驗證。請勿把密碼傳給任何人。</p></section>
<section id="dashboard" hidden><div class="actions"><button id="logout">登出</button><button id="reload">重新整理</button><button id="export">下載 Excel</button></div><label>搜尋姓名、手機、症狀、備註 <input id="search" placeholder="輸入關鍵字"></label><p id="count"></p><div id="cards"></div></section>
<script src="./config.js"></script><script src="./xlsx.js"></script><script>
let token=null,records=[];const $=id=>document.getElementById(id),msg=s=>$('status').textContent=s;
async function api(path,options={}){const r=await fetch(SB+path,{...options,headers:{apikey:KEY,...(token?{Authorization:'Bearer '+token}:{}),'Content-Type':'application/json',...(options.headers||{})}});const raw=await r.text();let v;try{v=raw?JSON.parse(raw):null}catch{v=null}if(!r.ok)throw Error(v?.msg||v?.message||v?.error_description||'操作失敗，請重新登入');return v}
const labels={pending:'待確認',confirmed:'已確認',completed:'已完成',cancelled:'已取消'};const outcomes={normal:'正常',cancelled_before_service:'服務前取消',cancelled_during_service:'服務中取消'};
function field(parent,label,value){const d=document.createElement('div');const b=document.createElement('b');b.textContent=label+'：';d.append(b,document.createTextNode(value||'—'));parent.append(d)}
async function saveOutcome(r,type,note){if(type!=='normal'&&!note.trim()){msg('取消紀錄必須填寫備註');return}const status=type==='cancelled_before_service'?'cancelled':type==='cancelled_during_service'?'completed':r.status;const patch={outcome:type,outcome_note:type==='normal'?null:note.trim(),outcome_at:type==='normal'?null:new Date().toISOString(),status};await api('/rest/v1/appointments?id=eq.'+r.id,{method:'PATCH',body:JSON.stringify(patch)});msg('已存檔：'+outcomes[type]);await refresh()}
function show(){const q=$('search').value.trim().toLowerCase();const selected=records.filter(r=>[r.submitted_name,r.submitted_phone,r.symptoms,r.notes,r.outcome_note].join(' ').toLowerCase().includes(q));$('cards').replaceChildren();for(const r of selected){const c=document.createElement('article');c.className='card';const h=document.createElement('h3');h.textContent=(r.submitted_name||r.customers?.name||'未填姓名')+'｜'+new Date(r.starts_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'});c.append(h);const g=document.createElement('div');g.className='grid';field(g,'手機',r.submitted_phone||r.customers?.phone);field(g,'服務',r.service_name);field(g,'金額',r.price_ntd?'NT$ '+r.price_ntd:'');field(g,'預約狀態',labels[r.status]||r.status);field(g,'處理結果',outcomes[r.outcome||'normal']);field(g,'處理時間',r.outcome_at?new Date(r.outcome_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'—');c.append(g);field(c,'症狀',r.symptoms);field(c,'客人備註',r.notes);field(c,'取消／服務紀錄備註',r.outcome_note);const status=document.createElement('select');for(const [v,l] of Object.entries(labels))status.add(new Option(l,v,v===r.status,v===r.status));status.onchange=async()=>{if(status.value==='completed'&&!confirm('確認服務已完成？')){status.value=r.status;return}try{await api('/rest/v1/appointments?id=eq.'+r.id,{method:'PATCH',body:JSON.stringify({status:status.value})});msg('預約狀態已更新');await refresh()}catch(e){msg(e.message)}};c.append(document.createTextNode('預約狀態：'),status);const note=document.createElement('textarea');note.placeholder='取消原因／服務中止原因（取消時必填）';note.value=r.outcome_note||'';c.append(note);const a=document.createElement('div');a.className='actions';const normal=document.createElement('button');normal.textContent='正常完成';normal.onclick=async()=>{if(!confirm('確認正常完成本次服務？'))return;try{await api('/rest/v1/appointments?id=eq.'+r.id,{method:'PATCH',body:JSON.stringify({status:'completed',outcome:'normal',outcome_note:null,outcome_at:null})});msg('已存檔：正常完成');await refresh()}catch(e){msg(e.message)}};const before=document.createElement('button');before.className='danger';before.textContent='服務前取消';before.onclick=async()=>{if(!confirm('確認客人在服務開始前取消？此時段將重新釋放。'))return;try{await saveOutcome(r,'cancelled_before_service',note.value)}catch(e){msg(e.message)}};const during=document.createElement('button');during.className='warn';during.textContent='服務中取消';during.onclick=async()=>{if(!confirm('確認服務進行到一半中止？將保留為服務紀錄。'))return;try{await saveOutcome(r,'cancelled_during_service',note.value)}catch(e){msg(e.message)}};a.append(normal,before,during);c.append(a);$('cards').append(c)}$('count').textContent='顯示 '+selected.length+' 筆預約';}
async function refresh(){try{records=[];for(let offset=0;;offset+=500){const rows=await api('/rest/v1/appointments?select=*,customers(name,phone,line_id)&order=starts_at.desc&limit=500&offset='+offset);records.push(...rows);if(rows.length<500)break}show();msg('資料已更新')}catch(e){msg(e.message)}}
$('signin').onclick=async()=>{try{const v=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:'guts1989921@gmail.com',password:$('password').value})});token=v.access_token;if(!v.user.email_confirmed_at||v.user.email?.toLowerCase()!=='guts1989921@gmail.com')throw Error('請先完成信箱驗證');$('password').value='';$('login').hidden=true;$('dashboard').hidden=false;await refresh()}catch(e){token=null;msg(e.message)}};
$('signup').onclick=async()=>{if($('password').value.length<12){msg('請設定至少 12 碼密碼');return}try{await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:'guts1989921@gmail.com',password:$('password').value})});$('password').value='';msg('請到管理員信箱完成驗證後回來登入。')}catch(e){msg(e.message)}};
$('logout').onclick=async()=>{try{await api('/auth/v1/logout',{method:'POST'})}catch{}token=null;records=[];$('cards').replaceChildren();$('dashboard').hidden=true;$('login').hidden=false;msg('已登出')};$('reload').onclick=refresh;$('search').oninput=show;
$('export').onclick=()=>{const rows=[['姓名','手機','服務','日期時間（臺灣）','費用','預約狀態','處理結果','處理備註','處理時間','症狀','客人備註','申請編號'],...records.map(r=>[r.submitted_name||r.customers?.name,r.submitted_phone||r.customers?.phone,r.service_name,new Date(r.starts_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}),r.price_ntd,labels[r.status],outcomes[r.outcome||'normal'],r.outcome_note||'',r.outcome_at?new Date(r.outcome_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'',r.symptoms,r.notes,r.id])];downloadXlsx(rows,'鬆沐預約資料-'+new Date().toISOString().slice(0,10)+'.xlsx');msg('已產生 Excel。')};
</script></html>
