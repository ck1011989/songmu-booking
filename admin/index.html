l><p class="muted">同一位會員的紀錄按預約時間由舊到新排列。</p><p id="historyCount"></p><div id="historyCards"></div></section>
<script src="/songmu-booking/admin/config.js"></script><script src="/songmu-booking/admin/xlsx.js?v=20261006-income"></script><script src="/songmu-booking/admin/revenue.js?v=20261006-income"></script><script>
const ADMIN_PATH='/songmu-booking/admin/',ADMIN_URL='https://ck1011989.github.io'+ADMIN_PATH;
if(location.pathname!==ADMIN_PATH)location.replace(ADMIN_URL+location.search+location.hash);
let token=null,records=[],pageView=new URLSearchParams(location.search).get('view')==='history'?'history':'bookings';const $=id=>document.getElementById(id),msg=s=>$('status').textContent=s;
function friendlyError(text=''){const s=String(text).toLowerCase();if(s.includes('service_not_finished'))return '這筆預約尚未到服務結束時間，暫時不能標記完成。若只是測試預約，可填寫原因後按「服務前取消」。';if(s.includes('email rate limit exceeded')||s.includes('rate limit'))return '密碼重設信寄送次數過於頻繁，請稍後再試，請勿重複點擊「忘記密碼」。';if(s.includes('invalid login credentials'))return '密碼不正確，請重新輸入；若忘記密碼請使用「忘記密碼？」。';if(s.includes('email not confirmed'))return '管理員信箱尚未完成驗證，請先查看驗證信。';if(s.includes('password')&&s.includes('characters'))return '密碼格式不符合要求，請設定至少 12 碼的新密碼。';return text||'操作失敗，請稍後再試。'}
async function api(path,options={}){if(adminSession&&adminSession.expires_at*1000<=Date.now()+60000)await refreshAdminSession();const r=await fetch(SB+path,{...options,headers:{apikey:KEY,...(token?{Authorization:'Bearer '+token}:{}),'Content-Type':'application/json',...(options.headers||{})}});const raw=await r.text();let v;try{v=raw?JSON.parse(raw):null}catch{v=null}if(!r.ok)throw Error(friendlyError(v?.msg||v?.message||v?.error_description||'操作失敗，請重新登入'));return v}
const labels={pending:'待確認',confirmed:'已確認',completed:'已完成',cancelled:'已取消'},outcomes={normal:'正常完成',cancelled_before_service:'服務前取消',cancelled_during_service:'服務中取消'};
function field(parent,label,value){const d=document.createElement('div'),b=document.createElement('b');b.textContent=label+'：';d.append(b,document.createTextNode(value||'—'));parent.append(d)}
function isArchived(r){return r.status==='completed'||r.status==='cancelled'}
function recordOutcome(r){return r.outcome==='cancelled_during_service'?'cancelled_during_service':r.status==='cancelled'||r.outcome==='cancelled_before_service'?'cancelled_before_service':'normal'}

const SESSION_KEY='songmu-admin-session';
let adminSession=null,sessionRefresh=null;
function clearAdminSession(){adminSession=null;token=null;try{sessionStorage.removeItem(SESSION_KEY)}catch{}}
function storeAdminSession(v){if(!v.user?.email_confirmed_at||v.user.email?.toLowerCase()!=='guts1989921@gmail.com')throw Error('請使用已驗證的管理員帳號登入');adminSession={access_token:v.access_token,refresh_token:v.refresh_token,expires_at:v.expires_at||Math.floor(Date.now()/1000)+v.expires_in};token=v.access_token;try{sessionStorage.setItem(SESSION_KEY,JSON.stringify(adminSession))}catch{msg('瀏覽器無法保留登入狀態，重新整理後需再次登入。')}}
async function refreshAdminSession(){if(sessionRefresh)return sessionRefresh;sessionRefresh=(async()=>{const r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:adminSession.refresh_token})});if(!r.ok){if(r.status===400||r.status===401)clearAdminSession();throw Error('登入狀態無法更新，請重新登入或稍後再試。')}storeAdminSession(await r.json())})().finally(()=>{sessionRefresh=null});return sessionRefresh}
async function restoreAdminSession(){try{const saved=sessionStorage.getItem(SESSION_KEY);if(!saved)return;adminSession=JSON.parse(saved);if(!adminSession.access_token||!adminSession.refresh_token||!Number.isFinite(adminSession.expires_at)){clearAdminSession();return}token=adminSession.access_token;const user=await api('/auth/v1/user');if(!user.email_confirmed_at||user.email?.toLowerCase()!=='guts1989921@gmail.com'){clearAdminSession();throw Error('請使用管理員帳號登入')}$('login').hidden=true;rememberAdmin();setPage(pageView,false);await refresh()}catch(e){token=null;msg(friendlyError(e.message))}}

function rememberAdmin(){try{localStorage.setItem('songmu-admin-created','yes')}catch{}$('signup').hidden=true}
$('signup').hidden=true;
function setPage(view,updateUrl=true,type=null){if(type)$('historyFilter').value=type;pageView=view;$('dashboard').hidden=!token||view!=='bookings';$('historyPage').hidden=!token||view!=='history';if(updateUrl)history.pushState(null,'',ADMIN_PATH+(view==='history'?'?view=history&type='+encodeURIComponent($('historyFilter').value):''));show()}
function showHistory(){
$('historyTitle').textContent=({'normal':'正常完成紀錄','cancelled_before_service':'服務前取消紀錄','cancelled_during_service':'服務中取消紀錄'})[$('historyFilter').value]||'全部會員紀錄';
const q=$('historySearch').value.trim().toLowerCase(),filter=$('historyFilter').value;
const selected=records.filter(r=>isArchived(r)&&(filter==='all'||recordOutcome(r)===filter)&&[r.submitted_name,r.submitted_phone,r.symptoms,r.notes,r.outcome_note,r.customers?.name,r.customers?.phone].join(' ').toLowerCase().includes(q));
const groups=new Map();for(const r of selected){const key=r.line_member_id||r.customer_id||r.submitted_phone||r.id;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r)}
$('historyCards').replaceChildren();
for(const group of [...groups.values()].sort((a,b)=>Math.max(...b.map(r=>Date.parse(r.starts_at)))-Math.max(...a.map(r=>Date.parse(r.starts_at))))){
group.sort((a,b)=>Date.parse(a.starts_at)-Date.parse(b.starts_at)||String(a.id).localeCompare(String(b.id)));
const member=document.createElement('article');member.className='card';const latest=group[group.length-1],heading=document.createElement('h3');heading.textContent=latest.submitted_name||latest.customers?.name||'未填姓名';member.append(heading);field(member,'手機',latest.submitted_phone||latest.customers?.phone);
for(const r of group){const entry=document.createElement('section');entry.className='card';const h=document.createElement('h4');h.textContent=new Date(r.starts_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})+'｜'+outcomes[recordOutcome(r)];entry.append(h);field(entry,'服務',r.service_name);field(entry,'金額',r.price_ntd==null?'—':'NT$ '+r.price_ntd);field(entry,'症狀',r.symptoms);field(entry,'客人備註',r.notes);field(entry,'處理備註',r.outcome_note);field(entry,'處理時間',r.outcome_at?new Date(r.outcome_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'—');field(entry,'LINE 通知',({accepted:'LINE 已接受通知',pending:'等待發送',failed:'未成功，可重試',skipped:'未綁定 LINE',not_requested:'舊紀錄，未發送'})[r.line_notification_status]||'未發送');if(['pending','failed'].includes(r.line_notification_status)){const retry=document.createElement('button');retry.textContent='重試 LINE 通知';retry.onclick=async()=>{retry.disabled=true;await notifyOutcome(r.id);retry.disabled=false};entry.append(retry)}member.append(entry)}
$('historyCards').append(member)}
$('historyCount').textContent=groups.size+' 位會員，共 '+selected.length+' 筆紀錄';if(!selected.length){const p=document.createElement('p');p.textContent='目前沒有符合條件的完成或取消紀錄。';$('historyCards').append(p)}
}
async function notifyOutcome(id){try{const result=await api('/functions/v1/notify-outcome',{method:'POST',body:JSON.stringify({appointment_id:id})});const record=records.find(r=>r.id===id);if(record)record.line_notification_status=result.status;msg(result.message||'通知處理完成');if(pageView==='history')showHistory()}catch{msg('預約已存檔，但通知尚未成功，可在客人紀錄中重試。')}}
async function saveOutcome(r,type,note){
if(r.status!=='confirmed'){msg('請先將預約狀態改為「已確認」，才能處理完成或取消。');return}
if(type!=='normal'&&!note.trim()){msg('取消紀錄必須填寫備註');return}
const status=type==='cancelled_before_service'?'cancelled':'completed';
const original=records.find(item=>item.id===r.id);records=records.filter(item=>item.id!==r.id);show();msg('正在存入'+outcomes[type]+'紀錄…');
let saved;try{saved=await api('/rest/v1/appointments?id=eq.'+r.id+'&status=eq.confirmed',{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({outcome:type,outcome_note:type==='normal'?null:note.trim(),outcome_at:new Date().toISOString(),status})});
if(!saved?.length)throw Error('這筆預約已被處理，請重新整理確認紀錄。');
records.push({...r,...saved[0]});
}catch(error){if(original&&!records.some(item=>item.id===r.id))records.push(original);show();throw error}
show();msg('已存入客人紀錄：'+outcomes[type]+'，正在通知客人…');await notifyOutcome(r.id)
}
function showIncome(){const report=revenueReport(records);const g=$('incomeSummary');g.replaceChildren();for(const [label,amount] of [['正常服務總費用',report.total],['今日收入',report.todayTotal],['本週收入',report.weekTotal],['本月收入',report.monthTotal]])field(g,label,'NT$ '+amount.toLocaleString('zh-TW'))}
function show(){showIncome();if(pageView==='history'){showHistory();return}const q=$('search').value.trim().toLowerCase(),selected=records.filter(r=>!isArchived(r)&&[r.submitted_name,r.submitted_phone,r.symptoms,r.notes,r.outcome_note].join(' ').toLowerCase().includes(q));$('cards').replaceChildren();for(const r of selected){const c=document.createElement('article');c.className='card';const h=document.createElement('h3');h.textContent=(r.submitted_name||r.customers?.name||'未填姓名')+'｜'+new Date(r.starts_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'});c.append(h);const g=document.createElement('div');g.className='grid';field(g,'手機',r.submitted_phone||r.customers?.phone);field(g,'服務',r.service_name);field(g,'金額',r.price_ntd?'NT$ '+r.price_ntd:'');field(g,'預約狀態',labels[r.status]||r.status);field(g,'處理結果',isArchived(r)?outcomes[recordOutcome(r)]:'尚未處理');field(g,'處理時間',r.outcome_at?new Date(r.outcome_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'—');c.append(g);field(c,'症狀',r.symptoms);field(c,'客人備註',r.notes);field(c,'取消／服務紀錄備註',r.outcome_note);const status=document.createElement('select');for(const [v,l] of Object.entries({pending:'待確認',confirmed:'已確認'}))status.add(new Option(l,v,v===r.status,v===r.status));status.onchange=async()=>{if(status.value==='completed'&&!confirm('確認服務已完成？')){status.value=r.status;return}try{await api('/rest/v1/appointments?id=eq.'+r.id+'&status=in.(pending,confirmed)',{method:'PATCH',body:JSON.stringify({status:status.value})});msg('預約狀態已更新');await refresh()}catch(e){msg(e.message)}};c.append(document.createTextNode('預約狀態：'),status);if(r.status==='confirmed'){const note=document.createElement('textarea');note.placeholder='取消原因／服務中止原因（取消時必填）';note.value=r.outcome_note||'';c.append(note);const a=document.createElement('div');a.className='actions';for(const [text,cls,type,confirmText] of [['正常完成','', 'normal','確認正常完成本次服務？存檔後將發送 LINE 通知給這位客人。'],['服務前取消','danger','cancelled_before_service','確認客人在服務開始前取消？此時段將重新釋放，並發送 LINE 通知給這位客人。'],['服務中取消','warn','cancelled_during_service','確認服務進行到一半中止？將保留為服務紀錄，並發送 LINE 通知給這位客人。']]){const b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=async()=>{if(type==='normal'&&Date.now()<Date.parse(r.ends_at||new Date(Date.parse(r.starts_at)+r.duration_minutes*60000).toISOString())){const notice='這筆預約尚未到服務結束時間（'+new Date(r.ends_at||Date.parse(r.starts_at)+r.duration_minutes*60000).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})+'），暫時不能標記完成。若只是測試預約，可填寫原因後按「服務前取消」。';msg(notice);alert(notice);return}if(type!=='normal'&&!note.value.trim()){msg('請先填寫取消原因，再按「'+text+'」。');alert('請先填寫取消原因，再按「'+text+'」。');note.focus();return}if(!confirm(confirmText))return;b.disabled=true;try{await saveOutcome(r,type,note.value)}catch(e){msg(e.message)}finally{b.disabled=false}};a.append(b)}c.append(a)}$('cards').append(c)}$('count').textContent='顯示 '+selected.length+' 筆預約'}
async function refresh(){try{records=[];for(let offset=0;;offset+=500){const rows=await api('/rest/v1/appointments?select=*,customers(name,phone,line_id)&order=starts_at.desc&limit=500&offset='+offset);records.push(...rows);if(rows.length<500)break}show();msg('資料已更新')}catch(e){msg(e.message)}}
$('signin').onclick=async()=>{try{const v=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:'guts1989921@gmail.com',password:$('password').value})});storeAdminSession(v);$('password').value='';$('login').hidden=true;rememberAdmin();setPage(pageView,false);await refresh()}catch(e){clearAdminSession();msg(friendlyError(e.message))}};
$('signup').onclick=async()=>{if($('password').value.length<12){msg('請設定至少 12 碼密碼');return}try{await api('/auth/v1/signup?redirect_to='+encodeURIComponent(ADMIN_URL),{method:'POST',body:JSON.stringify({email:'guts1989921@gmail.com',password:$('password').value})});$('password').value='';msg('請到管理員信箱完成驗證後回來登入。')}catch(e){msg(friendlyError(e.message))}};
$('forgot').onclick=async()=>{if(!confirm('要寄送密碼重設信到管理員信箱 guts1989921@gmail.com 嗎？'))return;try{await api('/auth/v1/recover?redirect_to='+encodeURIComponent(ADMIN_URL),{method:'POST',body:JSON.stringify({email:'guts1989921@gmail.com'})});msg('密碼重設信已送出。請查看管理員信箱，點擊最新信件中的「重設密碼」。請勿連續重複寄送。')}catch(e){msg(friendlyError(e.message))}};
async function readRecovery(){
const hash=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search);
const error=hash.get('error_description')||query.get('error_description');
if(error){history.replaceState(null,'',ADMIN_PATH);msg('重設連結已失效或過期，請重新寄送密碼重設信並使用最新信件。');return}
const access=hash.get('access_token'),type=hash.get('type');
if(access&&type==='recovery'){
 clearAdminSession();token=access;history.replaceState(null,'',ADMIN_PATH);
 try{const user=await api('/auth/v1/user');if(!user.email_confirmed_at||user.email?.toLowerCase()!=='guts1989921@gmail.com')throw Error('此連結不是管理員的密碼重設連結');
 $('login').hidden=true;$('dashboard').hidden=true;$('reset').hidden=false;msg('請設定新的管理員密碼。');
 }catch(e){token=null;msg(friendlyError(e.message))}
}}
$('savePassword').onclick=async()=>{const p=$('newPassword').value,p2=$('newPassword2').value;if(p.length<12){msg('新密碼至少需要 12 碼');return}if(p!==p2){msg('兩次輸入的密碼不一致');return}try{await api('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:p})});$('newPassword').value=$('newPassword2').value='';$('reset').hidden=true;$('login').hidden=false;token=null;history.replaceState(null,'',location.pathname);msg('密碼已更新，請使用新密碼登入。')}catch(e){msg(friendlyError(e.message))}};$('cancelReset').onclick=()=>{token=null;$('reset').hidden=true;$('login').hidden=false;history.replaceState(null,'',location.pathname);msg('已取消密碼重設')};
$('logout').onclick=async()=>{try{await api('/auth/v1/logout',{method:'POST'})}catch{}clearAdminSession();records=[];$('cards').replaceChildren();$('historyCards').replaceChildren();$('historyPage').hidden=true;$('dashboard').hidden=true;$('login').hidden=false;msg('已登出')};$('reload').onclick=refresh;$('search').oninput=show;
$('export').onclick=()=>{try{downloadXlsx(revenueWorkbookSheets(records),'鬆沐預約資料-'+taiwanDay(new Date())+'.xlsx');msg('已產生服務分類與收入統計 Excel。')}catch(e){msg(e.message)}};
$('historyFilter').value=new URLSearchParams(location.search).get('type')||'normal';if(!['normal','cancelled_before_service','cancelled_during_service','all'].includes($('historyFilter').value))$('historyFilter').value='normal';
$('historyNormal').onclick=()=>setPage('history',true,'normal');$('historyBefore').onclick=()=>setPage('history',true,'cancelled_before_service');$('historyDuring').onclick=()=>setPage('history',true,'cancelled_during_service');$('backBookings').onclick=()=>setPage('bookings');$('historyReload').onclick=refresh;$('historySearch').oninput=showHistory;$('historyFilter').onchange=()=>setPage('history',true,$('historyFilter').value);
window.addEventListener('popstate',()=>setPage(new URLSearchParams(location.search).get('view')==='history'?'history':'bookings',false,new URLSearchParams(location.search).get('type')||'normal'));
if(location.hash.includes('access_token=')||location.hash.includes('error_description=')||new URLSearchParams(location.search).has('error_description'))readRecovery();else restoreAdminSession();
let installPrompt=null;
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;$('installApp').hidden=false;$('installStatus').textContent='可將鬆沐管理安裝到電腦。'});
$('installApp').onclick=async()=>{if(!installPrompt)return;const prompt=installPrompt;installPrompt=null;await prompt.prompt();const result=await prompt.userChoice;$('installApp').hidden=true;$('installStatus').textContent=result.outcome==='accepted'?'已安裝鬆沐管理。':'已取消安裝，可使用 Brave 選單中的安裝功能。'};
window.addEventListener('appinstalled',()=>{$('installApp').hidden=true;$('installStatus').textContent='已安裝鬆沐管理。'});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register(ADMIN_PATH+'sw.js',{scope:ADMIN_PATH,updateViaCache:'none'}).then(r=>r.update()).catch(()=>{$('installStatus').textContent='安裝功能暫時無法啟用，請重新整理後再試。'}));
</script></html>
