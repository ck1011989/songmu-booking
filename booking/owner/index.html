<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>綁定臨時預約通知｜鬆沐整復</title>
<style>
:root{--forest:#1c4431;--soft:#eef4ef;--muted:#6b746e;--warn:#b5532f}
body{margin:0;background:#eef1ec;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;color:#2f3430}
.box{max-width:460px;margin:0 auto;min-height:100dvh;background:#fff;padding:32px 22px;box-sizing:border-box;text-align:center}
h1{font-size:21px;color:var(--forest);margin:8px 0 6px}p{line-height:1.7;color:var(--muted);margin:8px 0}
.icon{font-size:46px}.ok{color:var(--forest);font-weight:700}.err{color:var(--warn);font-weight:600}
.card{background:var(--soft);border-radius:14px;padding:14px 16px;text-align:left;font-size:14px;line-height:1.7;margin-top:18px;color:#2f3430}
button{margin-top:16px;font:inherit;font-size:16px;padding:12px 22px;border-radius:12px;border:2px solid var(--forest);background:var(--forest);color:#fff}

</style></head><body><div class="box" id="box"></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const API="https://wwavyzxxfspulofwpkmn.supabase.co/functions/v1/booking-api";
const APIKEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3YXZ5enh4ZnNwdWxvZndwa21uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMTI0MjgsImV4cCI6MjEwNjY4ODQyOH0.Xc6e5AIerl7E9KlWfd-aY2GyftQ_UNpBR7-YIOVw9Ik";const H={apikey:APIKEY,Authorization:"Bearer "+APIKEY};
const box=document.getElementById('box');const code=(new URLSearchParams(location.search).get('code')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const show=(icon,title,html,btn)=>{box.innerHTML='<div class="icon">'+icon+'</div><h1>'+title+'</h1>'+html+(btn?'<button type="button" id="b">'+btn[0]+'</button>':'');if(btn)document.getElementById('b').onclick=btn[1]};
const tip='<div class="card">之後只要有客人<b>預約當天的時段</b>（定點或到府），鬆沐官方帳號會傳 LINE 提醒你。<br>通知只寫時間與服務，不含客人姓名電話，詳細資料請到後台查看。<br>要收到通知，你的 LINE 需要是鬆沐官方帳號的好友。</div>';
async function start(){
 if(!/^[A-Z0-9]{8}$/.test(code))return show('⚠️','綁定連結不完整','<p class="err">請回到後台「時段設定」重新產生綁定連結。</p>');
 show('⏳','正在綁定…','<p>正在透過 LINE 確認你的帳號，請稍候。</p>');
 try{
  const c=await fetch(API+'?action=config',{headers:H,cache:'no-store'}).then(r=>r.json());
  if(!c.enabled||!c.liff_id)throw Error('LINE 登入暫時無法使用');
  await liff.init({liffId:c.liff_id});
  if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}
  const token=liff.getIDToken();if(!token)throw Error('LINE 登入缺少必要授權');
  const r=await fetch(API,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({action:'bind_owner',code,line_id_token:token})});
  const v=await r.json().catch(()=>({}));if(!r.ok||!v.ok)throw Error(v.error||'綁定失敗，請稍後再試');
  show('✅','綁定完成','<p class="ok">'+(v.pushed?'官方帳號剛剛傳了一則確認訊息給你。':'已綁定。若沒收到確認訊息，請先把鬆沐官方帳號加為好友。')+'</p>'+tip,liff.isInClient()?['關閉',()=>liff.closeWindow()]:null);
 }catch(e){show('⚠️','綁定沒有完成','<p class="err">'+String(e.message).replace(/[<>&]/g,'')+'</p>',['再試一次',start])}
}
start();
</script></body></html>
